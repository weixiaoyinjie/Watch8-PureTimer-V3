name: Build Watch8 PureTimer V3 (SDK Fixed)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install Android SDK 35
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip source and build APK
        run: |
          test -f Watch8_PureTimer_V3_OneUpload.zip
          mkdir -p source
          unzip -q Watch8_PureTimer_V3_OneUpload.zip -d source
          test -f source/app/build.gradle
          cd source
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-PureTimer-V3-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
